[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpo-analytics"
version = "0.1.0"
description = "SQLite-backed RPO compliance, drift and capacity analytics over synthetic protection-run history."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Greysave contributors", email = "noreply@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]
# Windows has no system tz database; elsewhere the OS copy is used. UTC works without either.
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
tz = ["tzdata>=2024.1"]
dev = [
  "tzdata>=2024.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
]

[project.urls]
Homepage = "https://github.com/greysave/rpo-analytics"
Source = "https://github.com/greysave/rpo-analytics"
Issues = "https://github.com/greysave/rpo-analytics/issues"

[project.scripts]
rpo-analytics = "rpo_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpo_analytics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
